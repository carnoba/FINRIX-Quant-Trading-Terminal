[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrix"
version = "1.0.0"
description = "FINRIX Quantitative Trading Terminal — XAUUSD macro forecast engine with Rich CLI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "modal==0.73.0",
    "neuralforecast==1.7.5",
    "pyfredapi==0.10.2",
    "transformers==4.46.3",
    "torch==2.5.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "yfinance==0.2.48",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "rich==13.9.4",
    "questionary==2.0.1",
    "InquirerPy==0.3.4",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
finrix = "app:main"

[tool.setuptools.packages.find]
include = ["macro_forecast_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"