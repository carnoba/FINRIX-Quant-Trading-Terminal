name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Least-privilege token: the job only needs to read the repository.
    permissions:
      contents: read

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 xvfb

      - name: Install test dependencies
        # The heavy GPU/ML stack in requirements.txt (torch, neuralforecast,
        # transformers) is imported lazily, so the unit suite only needs the
        # lightweight runtime dependencies plus modal.
        run: |
          pip install --no-cache-dir --only-binary :all: \
            modal==1.6.3 \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            requests==2.32.3 \
            python-dotenv==1.0.1 \
            rich==13.9.4 \
            questionary==2.0.1 \
            InquirerPy==0.3.4 \
            pytest==8.3.4 \
            pytest-cov==6.0.0

      - name: Run Pytest with Coverage Report
        run: xvfb-run -a python -m pytest -q --cov=macro_forecast_engine --cov-report=xml:coverage.xml

      - name: Compileall check
        run: python -m compileall -q app.py macro_forecast_engine