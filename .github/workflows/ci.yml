name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 xvfb

      - name: Install test dependencies
        # The heavy GPU/ML stack in requirements.txt (torch, neuralforecast,
        # transformers) is imported lazily, so the unit suite only needs the
        # lightweight runtime dependencies plus modal.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            modal==0.73.0 \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            requests==2.32.3 \
            python-dotenv==1.0.1 \
            rich==13.9.4 \
            questionary==2.0.1 \
            InquirerPy==0.3.4 \
            pytest pytest-cov

      - name: Run pytest suite
        run: xvfb-run -a python -m pytest -q

      - name: Compileall check
        run: python -m compileall -q app.py macro_forecast_engine